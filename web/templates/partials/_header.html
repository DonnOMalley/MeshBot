    <header>
      <div class="header-identity">

        <span class="bot-description">{{ bot_description }}</span>
      </div>
      <div class="header-right">
        {% if active_page != 'about' %}
        <span id="refresh-label">Auto-refresh: 30s</span>
        <button onclick="refreshAll()">&#8635; Refresh</button>
        {% endif %}
      </div>
    </header>
    <nav>
      <a href="/" class="nav-link{% if active_page == 'dashboard' %} active{% endif %}">Dashboard</a>
      <a href="/nodes" class="nav-link{% if active_page == 'nodes' %} active{% endif %}">Nodes</a>
      <a href="/chat" class="nav-link{% if active_page == 'chat' %} active{% endif %}">Chat</a>
      <a href="/about" class="nav-link{% if active_page == 'about' %} active{% endif %}">About</a>
    </nav>
