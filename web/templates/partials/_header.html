<header>
  <div class="header-identity">
    <h1>
      <img src="/images/logo.png" class="header-logo" alt="" />
      <a href="/" class="header-title-link">{{ bot_name }}</a>
    </h1>
    <span class="bot-description">{{ bot_description }}</span>
  </div>
  <div class="header-right">
    {% if active_page != 'about' and active_page != 'dm' %}
    <span id="refresh-label">Auto-refresh: …</span>
    <button onclick="refreshAll()">&#8635; Refresh</button>
    {% endif %}
  </div>
</header>
<nav>
  <a href="/" class="nav-link{% if active_page == 'dashboard' %} active{% endif %}">
    <img src="/images/dashboard%20icon.png" class="nav-icon" alt="" />
    Dashboard
  </a>
  <a href="/nodes" class="nav-link{% if active_page == 'nodes' %} active{% endif %}">
    <img src="/images/nodes%20icon.png" class="nav-icon" alt="" />
    Nodes
  </a>
  <a href="/map" class="nav-link{% if active_page == 'map' %} active{% endif %}">&#129517; Map</a>
  <a href="/chat" class="nav-link{% if active_page == 'chat' %} active{% endif %}">
    <img src="/images/chat%20icon.png" class="nav-icon" alt="" />
    Chat
  </a>
  <a href="/history" class="nav-link{% if active_page == 'history' %} active{% endif %}">&#128197; History</a>
  {% set _admin_active = active_page in ['settings', 'console', 'dm', 'about'] %}
  <div class="nav-dropdown{% if _admin_active %} admin-active{% endif %}">
    <button class="nav-dropdown-trigger{% if _admin_active %} active{% endif %}" aria-haspopup="true">&#9881; Administration &#9662;</button>
    <div class="nav-dropdown-menu" role="menu">
      <a href="/settings" class="nav-dropdown-item{% if active_page == 'settings' %} active{% endif %}" role="menuitem">&#9881; Settings</a>
      <a href="/console" class="nav-dropdown-item{% if active_page == 'console' %} active{% endif %}" role="menuitem">&#x276F;&#x005F; Console</a>
      <a href="/dm" class="nav-dropdown-item{% if active_page == 'dm' %} active{% endif %}" role="menuitem">&#129514; Bot Test</a>
      <a href="/about" class="nav-dropdown-item{% if active_page == 'about' %} active{% endif %}" role="menuitem">&#9432; About</a>
    </div>
  </div>
</nav>
