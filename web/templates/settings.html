<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ bot_name }} &mdash; Settings</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
  </head>
  <body class="full-page settings-page">
    {% set active_page = 'settings' %} {% include "partials/_header.html" %}

    <main>
      <div class="about-content settings-content">
        <!-- LoRa Settings -->
        <section class="about-section">
          <div class="about-section-header">LoRa Settings</div>
          <div class="about-section-body" style="padding: 0">
            <div id="settings-lora-body">
              <p class="settings-loading empty" style="padding: 14px">Loading&hellip;</p>
            </div>
          </div>
        </section>

        <!-- Device Settings -->
        <section class="about-section">
          <div class="about-section-header">Device Settings</div>
          <div class="about-section-body" style="padding: 0">
            <div id="settings-device-body">
              <p class="settings-loading empty" style="padding: 14px">Loading&hellip;</p>
            </div>
          </div>
        </section>

        <!-- Owner -->
        <section class="about-section">
          <div class="about-section-header">Owner</div>
          <div class="about-section-body" style="padding: 0">
            <div id="settings-user-body">
              <p class="settings-loading empty" style="padding: 14px">Loading&hellip;</p>
            </div>
          </div>
        </section>

        <!-- Channels -->
        <section class="about-section">
          <div class="about-section-header">Channels</div>
          <div class="about-section-body" style="padding: 0">
            <div id="settings-channels-body">
              <p class="settings-loading empty" style="padding: 14px">Loading&hellip;</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="/static/app.js"></script>
    <script src="/static/settings.js"></script>
  </body>
</html>
