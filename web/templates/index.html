<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ bot_name }} Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
  </head>
  <body>
    {% set active_page = 'dashboard' %} {% include "partials/_header.html" %}

    <main>
      <!-- Section 1: Node List (collapsible) -->
      <section class="panel">
        <div class="panel-header collapsible" id="node-panel-header" onclick="toggleNodePanel()">
          <img src="/images/dashboard%20icon.png" class="panel-icon" alt="" />
          <span class="panel-header-text">Node List</span>
        </div>
        <div class="panel-body" id="node-panel-body">
          <div class="node-toolbar">
            <input id="node-filter" type="text" class="node-filter-input" placeholder="Filter by name or device…" oninput="applyNodeFilter(this.value)" />
            <button class="node-export-btn" onclick="exportNodesCsv()">&#8681; Export CSV</button>
          </div>
          <div class="scroll-box">
            <table id="node-table">
              <thead>
                <tr>
                  <th class="fav-col">&#9734;</th>
                  <th data-col="long_name" class="sortable" onclick="handleSort('long_name')">Node Name</th>
                  <th>Role</th>
                  <th class="device-col">Device</th>
                  <th data-col="last_seen" class="sortable last-seen-col" onclick="handleSort('last_seen')">Last Seen</th>
                  <th class="position-col">Position</th>
                </tr>
              </thead>
              <tbody id="node-tbody">
                <tr><td colspan="6" class="empty">Loading&hellip;</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Section 2: Chat History -->
      <section class="panel">
        <div class="panel-header">
          <img src="/images/chat%20icon.png" class="panel-icon" alt="" />
          <span class="panel-header-text">Chat History</span>
        </div>
        <div id="channel-tabs" class="tabs">
          <span class="tab-empty">No channel history found.</span>
        </div>
        <div id="chat-messages" class="scroll-box messages">
          <p class="empty">Select a channel tab above.</p>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        await fetchFavorites();
        fetchNodes();
        fetchChannels();
        setInterval(refreshAll, REFRESH_INTERVAL_MS);
        updateSortIndicators();
      });
    </script>
  </body>
</html>
