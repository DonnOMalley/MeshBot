<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ bot_name }} Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
  </head>
  <body class="dashboard-page home-dashboard">
    {% set active_page = 'dashboard' %} {% include "partials/_header.html" %}

    <main>
      <!-- Happening-now banner: full width at the top; hidden when nothing is on -->
      <section class="home-now" id="dash-now-banner" aria-label="Happening now" hidden>
        <!-- populated by dashboard.js -->
      </section>

      <!-- Top: Joy as the page's headline, upcoming events in a rail beside it -->
      <div class="home-top">
        <section class="home-joy" id="dash-joy" aria-labelledby="home-joy-title">
          <div class="home-joy-head">
            <a href="/joy" class="home-joy-title" id="home-joy-title" title="Open Joy">&#10024; Joy</a>
            <button type="button" class="dash-joy-refresh home-joy-refresh" id="dash-joy-refresh"
                    title="Get a new affirmation, quote and joke" aria-label="Get a new affirmation, quote and joke">&#x21bb;</button>
          </div>
          <div class="home-joy-body" id="dash-joy-body" aria-live="polite">
            <!-- populated by dashboard.js -->
          </div>
        </section>

        <section class="home-events" id="dash-events" aria-labelledby="home-events-title">
          <div class="home-section-head">
            <a href="/events" class="home-section-title" id="home-events-title" title="Open Events">&#127881; Coming up</a>
            <button type="button" class="dash-joy-refresh" id="dash-events-refresh"
                    title="Refresh upcoming events" aria-label="Refresh upcoming events">&#x21bb;</button>
          </div>
          <div class="home-events-body" id="dash-events-body">
            <p class="home-empty">Loading events&hellip;</p>
          </div>
        </section>
      </div>

      <!-- Bottom: the reading panels, quieter than the top -->
      <div class="home-bottom">
        <section class="home-panel" id="dash-chat" aria-labelledby="home-chat-title">
          <div class="home-section-head">
            <a href="/chat" class="home-section-title" id="home-chat-title" title="Open Chat">&#128172; Chat history</a>
          </div>
          <div id="channel-tabs" class="tabs">
            <span class="tab-empty">No channel history found.</span>
          </div>
          <div id="chat-messages" class="scroll-box messages">
            <p class="empty">Select a channel tab above.</p>
          </div>
        </section>

        <section class="home-panel" id="dash-history" aria-labelledby="dash-history-title">
          <div class="home-section-head">
            <a href="/history" class="home-section-title" id="dash-history-title" title="Open History">&#128197; Today in history</a>
          </div>
          <div class="home-history-body scroll-box" id="dash-history-body">
            <!-- populated by dashboard.js -->
          </div>
        </section>
      </div>
    </main>

    <script src="/static/app.js"></script>
    <script src="/static/dashboard.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        fetchChannels();
        dashboardInit();
        setInterval(fetchChannels, REFRESH_INTERVAL_MS);
      });
    </script>
  </body>
</html>
