<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ bot_name }} Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
  </head>
  <body class="dashboard-page home-dashboard">
    {% set active_page = 'dashboard' %} {% include "partials/_header.html" %}

    <main>
      <!-- Happening-now banner: full width above Joy + Events; hidden when nothing is on -->
      <section class="dash-now-banner" id="dash-now-banner" aria-label="Happening now" hidden>
        <!-- populated by dashboard.js -->
      </section>

      <!-- Two columns, two rows: Joy | Events over Chat History | Today in History -->
      <div class="dash-grid">
        <!-- Top left: Joy panel (Affirmation + Zen Quote + Joke) -->
        <div class="dash-joy panel" id="dash-joy">
          <div class="panel-header">
            <a href="/joy" class="panel-header-text panel-title-link" title="Open Joy">&#10024; Joy</a>
            <button type="button" class="dash-joy-refresh" id="dash-joy-refresh"
                    title="Get a new affirmation, quote and joke" aria-label="Refresh Joy">&#x21bb;</button>
          </div>
          <div class="dash-joy-body scroll-box" id="dash-joy-body">
            <!-- populated by dashboard.js -->
          </div>
        </div>

        <!-- Top right: Events panel (agenda of what's coming up) -->
        <div class="dash-events panel" id="dash-events">
          <div class="panel-header">
            <a href="/events" class="panel-header-text panel-title-link" title="Open Events">&#127881; Events</a>
            <button type="button" class="dash-joy-refresh" id="dash-events-refresh"
                    title="Refresh upcoming events" aria-label="Refresh Events">&#x21bb;</button>
          </div>
          <div class="dash-events-body scroll-box" id="dash-events-body">
            <p class="dash-events-empty">Loading&hellip;</p>
          </div>
        </div>

        <!-- Bottom left: Chat History -->
        <div class="dash-chat panel" id="dash-chat">
          <div class="panel-header">
            <img src="/images/chat%20icon.png" class="panel-icon" alt="" />
            <a href="/chat" class="panel-header-text panel-title-link" title="Open Chat">Chat History</a>
          </div>
          <div id="channel-tabs" class="tabs">
            <span class="tab-empty">No channel history found.</span>
          </div>
          <div id="chat-messages" class="scroll-box messages">
            <p class="empty">Select a channel tab above.</p>
          </div>
        </div>

        <!-- Bottom right: Today in History -->
        <div class="dash-history panel" id="dash-history">
          <div class="panel-header">
            <a href="/history" class="panel-header-text panel-title-link" id="dash-history-title" title="Open History">&#128197; Today in History</a>
          </div>
          <div class="dash-history-body scroll-box" id="dash-history-body">
            <!-- populated by dashboard.js -->
          </div>
        </div>
      </div>
    </main>

    <script src="/static/app.js"></script>
    <script src="/static/dashboard.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        fetchChannels();
        dashboardInit();
        setInterval(fetchChannels, REFRESH_INTERVAL_MS);
      });
    </script>
  </body>
</html>
